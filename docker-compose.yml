services:
  db:
    image: postgres:16-alpine
    container_name: manychat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: manychat
      POSTGRES_PASSWORD: manychat
      POSTGRES_DB: manychat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app's migrate step fails noisily if it starts before Postgres
      # accepts connections, so gate it on a real readiness probe.
      test: ["CMD-SHELL", "pg_isready -U manychat -d manychat"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: manychat-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://manychat:manychat@db:5432/manychat
      # Same server; Migrate wants the direct string and the schema declares it.
      DIRECT_URL: postgresql://manychat:manychat@db:5432/manychat
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CRON_SECRET: ${CRON_SECRET}
      IG_APP_SECRET: ${IG_APP_SECRET}
      IG_VERIFY_TOKEN: ${IG_VERIFY_TOKEN}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN}
      IG_USER_ID: ${IG_USER_ID:-}
      GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v26.0}
      BROADCAST_RATE: ${BROADCAST_RATE:-5}
      ACCOUNT_TIMEZONE: ${ACCOUNT_TIMEZONE:-America/Sao_Paulo}
      AUTH_SECRET: ${AUTH_SECRET}
      IG_USERNAME: ${IG_USERNAME:-}
      # Read by lib/client-ip.ts. Define it ONLY when a proxy (nginx, Caddy,
      # a load balancer) sits in front of this container: the last entry of
      # x-forwarded-for is trustworthy only when something appended it. With a
      # proxy and no TRUST_PROXY the login rate limit collapses into a single
      # global bucket; without a proxy and with TRUST_PROXY an attacker forges
      # the header and gets a fresh bucket per attempt. This deploy path is
      # exactly the one where it matters, so it has to be reachable here.
      TRUST_PROXY: ${TRUST_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENDER_ACTIONS: ${SENDER_ACTIONS:-on}
      HUMAN_AGENT: ${HUMAN_AGENT:-}
      # The {{secret.NAME}} of the Request node is a family, not one variable:
      # add one line per secret you use (FLOW_SECRET_CRM is the example in
      # .env.example).
      FLOW_SECRET_CRM: ${FLOW_SECRET_CRM:-}
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npm run start"

  # Resumes delay nodes and drains queued broadcasts. Separate from the web
  # process so a long broadcast can't block webhook acks.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: manychat-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://manychat:manychat@db:5432/manychat
      DIRECT_URL: postgresql://manychat:manychat@db:5432/manychat
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN}
      IG_USER_ID: ${IG_USER_ID:-}
      GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v26.0}
      BROADCAST_RATE: ${BROADCAST_RATE:-5}
      ACCOUNT_TIMEZONE: ${ACCOUNT_TIMEZONE:-America/Sao_Paulo}
      # The worker sends messages and runs flows, so it needs the same send
      # switches as the web process. TRUST_PROXY and AUTH_SECRET are absent on
      # purpose: it serves no HTTP and has no session.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENDER_ACTIONS: ${SENDER_ACTIONS:-on}
      HUMAN_AGENT: ${HUMAN_AGENT:-}
      WORKER_TICK_MS: ${WORKER_TICK_MS:-5000}
      FLOW_SECRET_CRM: ${FLOW_SECRET_CRM:-}
    command: npm run worker

volumes:
  pgdata:
